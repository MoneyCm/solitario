name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copiar el juego dentro de la app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html icon-192.png icon-512.png manifest.webmanifest android/app/src/main/assets/
      - name: Compilar
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Solitario.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Solitario-apk
          path: Solitario.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Solitario 1.0.${{ github.run_number }}
          files: Solitario.apk
          make_latest: true
          body: Descarga **Solitario.apk** desde el celular e instálalo.
